name: Make TWRP Device

on:
  workflow_dispatch:
    inputs:
      IMG_URL:    
        description: 'IMG_URL'
        required: true
        default: ''

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-latest
    
    steps:
    - name: Check Out
      uses: actions/checkout@main
      
    - name: Install Megatools
      run: sudo apt-get update && sudo apt-get install -y megatools
        sudo apt update
        sudo apt -y install python3 python3-pip cpio wget
        pip3 install twrpdtgen
        mkdir dt
      
    - name: Download Recovery Image
      run: |
        if [[ "${{ github.event.inputs.version }}" == *mega.nz* ]]; then
          sudo apt-get update && sudo apt-get install -y megatools
          megadl "${{ github.event.inputs.version }}"
        else
          wget -O recovery.img "${{ github.event.inputs.version }}"
        fi
      
    - name: Start build
      run: |
        python3 -m twrpdtgen -o dt/ *.img
    - name: ZIP device tree
      run: |
        zip -r DeviceTree.zip ./dt
    - name: Upload to Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ./DeviceTree.zip
        name: TWRP_Device_Tree-${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        body: DeviceTree for twrp
      env:
        GITHUB_TOKEN: ${{ secrets.TEST }}
